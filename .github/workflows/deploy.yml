name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: most-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (vars.VERCEL_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deployment credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo 'Configure VERCEL_TOKEN secret and project variables. See docs/DEPLOYMENT.md.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: npx --yes vercel@62.7.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@62.7.0 build --prod --token="$VERCEL_TOKEN"
      - name: Publish production
        run: npx --yes vercel@62.7.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
